<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Board / Brutal Auth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap');

        :root {
            --bg: #fff01f;
            --card-bg: #ffffff;
            --border: #000000;
            --shadow: #000000;
            --color-1: #ff90e8;
            --color-2: #23a094;
            --color-3: #91ff71;
            --color-4: #ff6000;
        }

        body {
            font-family: 'Unbounded', sans-serif;
            background-color: var(--bg);
            color: var(--border);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .brutal-card {
            background: var(--card-bg);
            border: 4px solid var(--border);
            box-shadow: 10px 10px 0px var(--shadow);
            padding: 25px;
            position: relative;
        }

        h2 {
            margin: 0 0 20px 0;
            text-transform: uppercase;
            font-size: 1.5rem;
            background: var(--bg);
            display: inline-block;
            padding: 5px 10px;
            border: 3px solid var(--border);
            transform: rotate(-2deg);
        }

        #myInfo {
            display: block;
            font-weight: 700;
            margin-bottom: 20px;
            text-decoration: underline;
            word-break: break-all;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .brutal-btn {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            border: 3px solid var(--border);
            padding: 15px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border);
            transition: all 0.1s;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .brutal-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--border);
        }

        .brutal-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border);
        }

        /* Стиль для кнопки Google */
        .auth-btn {
            grid-column: span 2;
            margin-top: 10px;
            background: #fff;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-row {
            display: flex;
            align-items: center;
            border: 3px solid var(--border);
            padding: 10px;
            background: #fff;
            transition: transform 0.2s;
        }

        .status-box {
            width: 40px;
            height: 40px;
            border-right: 3px solid var(--border);
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-info strong {
            display: block;
            font-size: 1rem;
        }

        .user-info small {
            font-size: 0.75rem;
            font-weight: 400;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brutal-card">
        <h2>Профиль</h2>
        <span id="myInfo">Загрузка...</span>
        
        <div class="status-grid">
            <button class="brutal-btn" style="background: var(--color-1);" onclick="changeStatus('Учусь', 'var(--color-1)')">Учусь</button>
            <button class="brutal-btn" style="background: var(--color-2);" onclick="changeStatus('Кофе', 'var(--color-2)')">Кофе</button>
            <button class="brutal-btn" style="background: var(--color-3);" onclick="changeStatus('В игре', 'var(--color-3)')">В игре</button>
            <button class="brutal-btn" style="background: var(--color-4);" onclick="changeStatus('Дома', 'var(--color-4)')">Дома</button>
            
            <button id="loginBtn" class="brutal-btn auth-btn">Войти через Google</button>
            <button id="logoutBtn" class="brutal-btn auth-btn" style="display:none; background: #eee;">Выйти</button>
        </div>
    </div>

    <div class="brutal-card">
        <h2>Группа</h2>
        <div id="groupList" class="user-list">
            <p>Ждем ответа от базы...</p>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const URL = 'https://uylunguxekgzxprnsgrr.supabase.co';
    const KEY = 'sb_publishable_aLabuAHu5q47IsXEKy8QXw_HTdlY4jt';
    const supabase = createClient(URL, KEY);

    let currentUser = null;

    // --- ЛОГИКА АВТОРИЗАЦИИ ---

    // Слушаем изменения состояния (вход/выход)
    supabase.auth.onAuthStateChange((event, session) => {
        currentUser = session?.user || null;
        updateUI();
        fetchGroup();
    });

    function updateUI() {
        const info = document.getElementById('myInfo');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        if (currentUser) {
            info.innerText = `Вы: ${currentUser.email}`;
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'block';
        } else {
            info.innerText = "Войдите, чтобы менять статус";
            loginBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
        }
    }

    document.getElementById('loginBtn').onclick = async () => {
        await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin }
        });
    };

    document.getElementById('logoutBtn').onclick = async () => {
        await supabase.auth.signOut();
    };

    // --- ЛОГИКА ДАННЫХ ---

    window.changeStatus = async (text, color) => {
        if (!currentUser) {
            alert("Сначала нужно войти!");
            return;
        }

        // Используем upsert: если записи нет - создаст, если есть - обновит
        const { error } = await supabase
            .from('profiles')
            .upsert({ 
                id: currentUser.id, 
                username: currentUser.email.split('@')[0], // Имя из почты
                status: text, 
                color: color 
            });

        if (error) console.error(error);
        else fetchGroup();
    };

    async function fetchGroup() {
        const { data, error } = await supabase
            .from('profiles')
            .select('*')
            .order('username', { ascending: true });

        if (error) return console.error(error);

        const list = document.getElementById('groupList');
        list.innerHTML = data.map(user => `
            <div class="user-row">
                <div class="status-box" style="background: ${user.color || '#eee'}">
                    ⚡
                </div>
                <div class="user-info">
                    <strong>${user.username}</strong>
                    <small>${user.status || 'OFFLINE'}</small>
                </div>
            </div>
        `).join('');
    }

    // Запуск
    setInterval(fetchGroup, 5000);
</script>

</body>
</html>
