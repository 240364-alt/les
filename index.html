<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Board / Brutal Analytics & Streaks</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght=400;700&display=swap');

        :root {
            --bg: #fff01f;
            --card-bg: #ffffff;
            --border: #000000;
            --shadow: #000000;
            --color-1: #ff90e8;
            --color-2: #23a094;
            --color-3: #91ff71;
            --color-4: #ff6000;
            --online: #00E676;
            --offline: #B0BEC5;
            
            --tier-common: #91ff71;
            --tier-rare: #ff90e8;
            --tier-epic: #23a094;
        }

        body {
            font-family: 'Unbounded', sans-serif;
            background-color: var(--bg);
            color: var(--border);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .brutal-card {
            background: var(--card-bg);
            border: 4px solid var(--border);
            box-shadow: 10px 10px 0px var(--shadow);
            padding: 25px;
            position: relative;
            border-radius: 12px;
        }

        h2 {
            margin: 0 0 20px 0;
            text-transform: uppercase;
            font-size: 1.4rem;
            background: var(--bg);
            display: inline-block;
            padding: 5px 10px;
            border: 3px solid var(--border);
            transform: rotate(-2deg);
        }

        #myInfo {
            display: block;
            font-weight: 700;
            margin-bottom: 20px;
            text-decoration: underline;
            word-break: break-all;
            font-size: 0.9rem;
        }

        /* Огненный бэдж для стрика дней */
        .streak-badge {
            font-size: 0.8rem;
            background: var(--color-4);
            color: #fff;
            border: 3px solid var(--border);
            padding: 5px 10px;
            margin-bottom: 15px;
            display: inline-block;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 3px 3px 0px var(--border);
        }

        .total-time-badge {
            font-size: 0.85rem;
            background: var(--color-1);
            color: var(--border);
            border: 3px solid var(--border);
            padding: 8px 14px;
            margin-top: -5px;
            margin-bottom: 20px;
            display: inline-block;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--border);
            transform: rotate(1deg);
        }

        .timer-container {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #fff;
            border: 3px solid var(--border);
            padding: 10px;
            box-shadow: 4px 4px 0px var(--border);
            border-radius: 8px;
        }
        .timer-time {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0055ff;
        }
        .timer-container.paused .timer-time {
            color: var(--color-4);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .brutal-btn {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            border: 3px solid var(--border);
            padding: 15px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border);
            transition: all 0.1s;
            text-transform: uppercase;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        .brutal-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--border);
        }

        .brutal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border);
        }

        .auth-btn {
            grid-column: span 2;
            margin-top: 10px;
        }

        #loginBtn { background: #fff; color: #000; }
        #logoutBtn { background: #000; color: #fff; display: none; }

        /* Табы */
        .tab-menu {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tab-btn {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 10px 5px;
            background: #fff;
            border: 3px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        .tab-btn.active {
            background: var(--bg);
            box-shadow: 3px 3px 0px var(--border);
            transform: translate(-1px, -1px);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* Брутальная карточка аналитики */
        .analytics-box {
            background: var(--color-3);
            border: 3px solid var(--border);
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 5px 5px 0px var(--border);
            border-radius: 8px;
        }
        .analytics-title {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 8px;
            background: #fff;
            display: inline-block;
            padding: 2px 6px;
            border: 2px solid var(--border);
        }

        /* Рейтинг */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .leaderboard-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 3px solid var(--border);
            padding: 12px;
            background: #fff;
            box-shadow: 4px 4px 0px var(--border);
            border-radius: 8px;
        }

        .leaderboard-rank {
            font-weight: 700;
            font-size: 0.9rem;
            background: var(--color-3);
            border: 2px solid var(--border);
            padding: 2px 8px;
            margin-right: 10px;
            border-radius: 4px;
        }

        /* Ачивки */
        .achievement-card {
            display: flex;
            align-items: center;
            gap: 15px;
            border: 3px solid var(--border);
            padding: 12px;
            background: #fff;
            box-shadow: 4px 4px 0px var(--border);
            border-radius: 8px;
            position: relative;
            opacity: 0.35;
            filter: grayscale(80%);
            transition: all 0.3s;
        }

        .achievement-card.unlocked {
            opacity: 1;
            filter: grayscale(0%);
        }

        .achievement-icon {
            font-size: 2rem;
            background: #eee;
            border: 2px solid var(--border);
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }
        
        .achievement-card.unlocked .achievement-icon {
            background: var(--bg);
        }

        .achievement-info strong {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .achievement-info small {
            display: block;
            font-size: 0.7rem;
            color: #555;
        }

        .achievement-tier {
            position: absolute;
            top: -10px;
            right: 10px;
            font-size: 0.55rem;
            font-weight: 700;
            border: 2px solid var(--border);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            box-shadow: 2px 2px 0px var(--border);
        }

        /* Группа и чат */
        .user-list { display: flex; flex-direction: column; gap: 15px; }
        .user-row { display: flex; align-items: center; border: 3px solid var(--border); padding: 12px; background: #fff; box-shadow: 4px 4px 0px var(--border); border-radius: 8px; }
        .online-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); margin-right: 12px; }
        .online-dot.true { background-color: var(--online); }
        .online-dot.false { background-color: var(--offline); }
        .user-info { flex-grow: 1; }
        .user-info strong { display: block; font-size: 1rem; font-weight: 700; }
        .user-info small { font-size: 0.8rem; color: #555; }
        
        .group-timer { margin-left: auto; font-size: 0.85rem; font-weight: 700; color: #0055ff; background: #e6f0ff; border: 2px solid var(--border); padding: 6px 10px; box-shadow: 2px 2px 0px var(--border); border-radius: 6px; }
        .group-timer.paused { color: #ff6000; background: #fff0e6; }

        .chat-box { border: 3px solid var(--border); background: #fff; height: 220px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; border-radius: 8px; }
        .chat-msg { font-size: 0.85rem; }
        .chat-msg b { background: var(--bg); padding: 2px 6px; border: 2px solid var(--border); margin-right: 8px; display: inline-block; border-radius: 4px; }
        .chat-input-group { display: flex; gap: 10px; }
        .chat-input { flex-grow: 1; font-family: 'Unbounded', sans-serif; padding: 12px; border: 3px solid var(--border); font-size: 0.85rem; outline: none; box-shadow: 3px 3px 0px var(--border); border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="brutal-card">
        <h2>Профиль</h2>
        <span id="myInfo">Загрузка...</span>
        
        <div><div id="myStreak" class="streak-badge" style="display: none;">🔥 Серия: 0 дн.</div></div>
        <div><div id="myTotalTime" class="total-time-badge" style="display: none;">Накоплено: 0 сек.</div></div>
        
        <div id="timerContainer" class="timer-container">
            <span id="timerLabel">⏱️ Сессия:</span>
            <span id="timerTime" class="timer-time">0 сек.</span>
            <button id="pauseBtn" class="brutal-btn" style="padding: 5px 10px; margin-left: auto; background: var(--color-2); font-size: 0.7rem;" onclick="togglePause()">Перерыв</button>
            <button class="brutal-btn" style="padding: 5px 10px; margin-left: 5px; background: var(--color-4); font-size: 0.7rem;" onclick="stopStudy()">Завершить</button>
        </div>

        <div class="status-grid">
            <button class="brutal-btn" style="background: var(--color-1);" onclick="startStudy()">Учусь</button>
            <button class="brutal-btn" style="background: var(--color-2);" onclick="changeStatus('Кофе', 'var(--color-2)')">Кофе</button>
            <button class="brutal-btn" style="background: var(--color-3);" onclick="changeStatus('В игре', 'var(--color-3)')">В игре</button>
            <button class="brutal-btn" style="background: var(--color-4);" onclick="changeStatus('Дома', 'var(--color-4)')">Дома</button>
            <button id="loginBtn" class="brutal-btn auth-btn">Войти через Google</button>
            <button id="logoutBtn" class="brutal-btn auth-btn">Выйти из аккаунта</button>
        </div>
    </div>

    <div class="brutal-card">
        <div class="tab-menu">
            <button id="btnGroupTab" class="tab-btn active" onclick="switchTab('group-tab')">👥 Группа</button>
            <button id="btnLeaderboardTab" class="tab-btn" onclick="switchTab('leaderboard-tab')">🏆 Топ-10</button>
            <button id="btnAchievementsTab" class="tab-btn" onclick="switchTab('achievements-tab')">🏅 Ачивки <span id="achBadgeCount">(0/0)</span></button>
        </div>

        <div id="group-tab" class="view-section active">
            <div id="groupList" class="user-list"><p>Синхронизация...</p></div>
        </div>

        <div id="leaderboard-tab" class="view-section">
            <div id="groupAnalyticsBox"></div>
            <div id="leaderboardList" class="leaderboard-list"></div>
        </div>

        <div id="achievements-tab" class="view-section">
            <div id="achievementsList" class="achievements-list"></div>
        </div>
    </div>

    <div class="brutal-card">
        <h2>Общий чат</h2>
        <div id="chatBox" class="chat-box"></div>
        <div class="chat-input-group">
            <input type="text" id="chatInput" class="chat-input" placeholder="Сообщение..." maxlength="150">
            <button id="chatSendBtn" class="brutal-btn var(--color-3)">➔</button>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const URL = 'https://uylunguxekgzxprnsgrr.supabase.co';
    const KEY = 'sb_publishable_aLabuAHu5q47IsXEKy8QXw_HTdlY4jt';
    const supabase = createClient(URL, KEY);

    let currentUser = null;
    let localProfileTimer = null;
    let groupTimerInterval = null;
    let currentStudyTimestamp = null;
    let accumulatedSeconds = 0;
    let isPausedLocal = false;
    let cachedGroupData = [];

    const achievementIcons = { first_step:'🌱', return:'🔄', early_bird:'🦅', marathon:'⚡', activist:'📢', soul_of_company:'🎤' };
    const tierColors = { 'ОБЫЧНОЕ':'var(--color-3)', 'РЕДКОЕ':'var(--color-1)', 'ЭПИЧЕСКОЕ':'var(--color-2)', 'ЛЕГЕНДАРНОЕ':'var(--color-4)' };

    window.switchTab = (tabId) => {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        
        if (tabId === 'group-tab') document.getElementById('btnGroupTab').classList.add('active');
        if (tabId === 'leaderboard-tab') {
            document.getElementById('btnLeaderboardTab').classList.add('active');
            fetchLeaderboard();
        }
        if (tabId === 'achievements-tab') {
            document.getElementById('btnAchievementsTab').classList.add('active');
            fetchAchievements();
        }
    };

    function formatDuration(sec) {
        if (sec < 0 || isNaN(sec)) return '0 сек.';
        if (sec < 60) return `${sec} сек.`;
        const m = Math.floor(sec / 60) % 60;
        const h = Math.floor(sec / 3600);
        return h > 0 ? `${h}ч ${m}м` : `${m} мин.`;
    }

    async function updateUI(session) {
        currentUser = session?.user || null;
        const info = document.getElementById('myInfo');
        const lBtn = document.getElementById('loginBtn');
        const oBtn = document.getElementById('logoutBtn');
        const totalBadge = document.getElementById('myTotalTime');
        const streakBadge = document.getElementById('myStreak');

        if (currentUser) {
            info.innerText = currentUser.user_metadata.full_name || currentUser.email.split('@')[0];
            lBtn.style.display = 'none';
            oBtn.style.display = 'block';
            totalBadge.style.display = 'inline-block';
            streakBadge.style.display = 'inline-block';
            setOnlineStatus(true);
            await updateStreak(); // Стрик запускается при логине
            checkActiveStudy();
            updateAchievementsBadge();
        } else {
            info.innerText = "Войдите через Google для смены статуса";
            lBtn.style.display = 'block';
            oBtn.style.display = 'none';
            totalBadge.style.display = 'none';
            streakBadge.style.display = 'none';
            document.getElementById('timerContainer').style.display = 'none';
            clearInterval(localProfileTimer);
        }
    }

    // ========================================================
    // ФУНКЦИЯ 1: Система Стриков (Серия дней)
    // ========================================================
    async function updateStreak() {
        if (!currentUser) return;
        const { data: profile, error } = await supabase.from('profiles').select('last_activity_date, streak_count').eq('id', currentUser.id).single();
        if (error || !profile) return;

        const todayStr = new Date().toISOString().split('T')[0];
        const lastDateStr = profile.last_activity_date;
        let newStreak = profile.streak_count || 0;

        if (lastDateStr !== todayStr) {
            if (lastDateStr) {
                const diffDays = Math.ceil(Math.abs(new Date(todayStr) - new Date(lastDateStr)) / (1000 * 60 * 60 * 24));
                if (diffDays === 1) newStreak += 1;
                else if (diffDays > 1) newStreak = 1;
            } else {
                newStreak = 1;
            }
            await supabase.from('profiles').update({ last_activity_date: todayStr, streak_count: newStreak }).eq('id', currentUser.id);
        }
        document.getElementById('myStreak').innerText = `🔥 Серия: ${newStreak} дн.`;
    }

    // ========================================================
    // ФУНКЦИЯ 2: Аналитика активности группы
    // ========================================================
    async function calculateGroupAnalytics() {
        const { data: students, error } = await supabase.from('profiles').select('total_study_time, is_online');
        if (error || !students || students.length === 0) return;

        const totalStudents = students.length;
        const onlineCount = students.filter(s => s.is_online).length;
        const totalSeconds = students.reduce((acc, curr) => acc + (curr.total_study_time || 0), 0);
        const averageSeconds = Math.round(totalSeconds / totalStudents);

        document.getElementById('groupAnalyticsBox').innerHTML = `
            <div class="analytics-box">
                <div class="analytics-title">📊 Пульс Группы</div>
                <div style="font-size:0.75rem; line-height:1.5; font-weight:700;">
                    • Студентов в сети: <span style="color:#0055ff">${onlineCount} / ${totalStudents}</span><br>
                    • Часов у всей группы: <span style="color:var(--color-4)">${Math.floor(totalSeconds / 3600)} ч.</span><br>
                    • Среднее время: <span style="color:var(--color-2)">${formatDuration(averageSeconds)}</span>
                </div>
            </div>
        `;
    }

    async function fetchLeaderboard() {
        await calculateGroupAnalytics(); // Сначала рендерим аналитику сверху

        const { data, error } = await supabase.from('profiles').select('username, total_study_time').order('total_study_time', { ascending: false }).limit(10);
        if (error) return;

        const container = document.getElementById('leaderboardList');
        if (data.length === 0) {
            container.innerHTML = '<p style="text-align:center; font-size:0.8rem;">Рейтинг пуст</p>';
            return;
        }
        container.innerHTML = data.map((user, i) => `
            <div class="leaderboard-row">
                <div><span class="leaderboard-rank">#${i + 1}</span><strong>${escapeHtml(user.username)}</strong></div>
                <span style="font-weight:700; color:#0055ff;">${formatDuration(user.total_study_time)}</span>
            </div>
        `).join('');
    }

    async function fetchAchievements() {
        const { data: allAch } = await supabase.from('achievements').select('*');
        let unlockedIds = [];
        if (currentUser) {
            const { data: myAch } = await supabase.from('user_achievements').select('achievement_id').eq('user_id', currentUser.id);
            if (myAch) unlockedIds = myAch.map(a => a.achievement_id);
        }
        const container = document.getElementById('achievementsList');
        container.innerHTML = allAch.map(ach => {
            const isUnlocked = unlockedIds.includes(ach.id);
            return `
                <div class="achievement-card ${isUnlocked ? 'unlocked' : ''}">
                    <div class="achievement-tier" style="background:${tierColors[ach.tier] || '#eee'}">${ach.tier}</div>
                    <div class="achievement-icon">${achievementIcons[ach.id] || '🏅'}</div>
                    <div class="achievement-info"><strong>${escapeHtml(ach.title)}</strong><small>${escapeHtml(ach.description)}</small></div>
                </div>
            `;
        }).join('');
    }

    async function updateAchievementsBadge() {
        if (!currentUser) return;
        const { data: all } = await supabase.from('achievements').select('id');
        const { data: my } = await supabase.from('user_achievements').select('achievement_id').eq('user_id', currentUser.id);
        if (all && my) document.getElementById('achBadgeCount').innerText = `(${my.length}/${all.length})`;
    }

    async function setOnlineStatus(status) {
        if (!currentUser) return;
        await supabase.from('profiles').upsert({ id: currentUser.id, username: currentUser.user_metadata.full_name || currentUser.email.split('@')[0], is_online: status }, { onConflict: 'id' });
    }

    async function checkActiveStudy() {
        if (!currentUser) return;
        const { data } = await supabase.from('profiles').select('study_started_at, total_study_time, is_paused').eq('id', currentUser.id).single();
        if (data) {
            accumulatedSeconds = data.total_study_time || 0;
            document.getElementById('myTotalTime').innerText = `Накоплено: ${formatDuration(accumulatedSeconds)}`;
            if (data.study_started_at) startLocalTimer(data.study_started_at, accumulatedSeconds, data.is_paused);
            else document.getElementById('timerContainer').style.display = 'none';
        }
    }

    function startLocalTimer(timestamp, storedSec, isPausedDB) {
        currentStudyTimestamp = new Date(timestamp); accumulatedSeconds = storedSec; isPausedLocal = isPausedDB;
        const container = document.getElementById('timerContainer'); const label = document.getElementById('timerLabel'); const pBtn = document.getElementById('pauseBtn');
        container.style.display = 'flex'; clearInterval(localProfileTimer);
        if (isPausedLocal) {
            container.classList.add('paused'); label.innerText = '☕ Пауза:'; pBtn.innerText = 'Продолжить'; pBtn.style.background = 'var(--color-3)';
            document.getElementById('timerTime').innerText = formatDuration(accumulatedSeconds);
        } else {
            container.classList.remove('paused'); label.innerText = '⏱️ Сессия:'; pBtn.innerText = 'Перерыв'; pBtn.style.background = 'var(--color-2)';
            localProfileTimer = setInterval(() => {
                const live = Math.floor((new Date() - currentStudyTimestamp) / 1000);
                document.getElementById('timerTime').innerText = formatDuration(accumulatedSeconds + live);
            }, 1000);
        }
    }

    window.startStudy = async () => {
        if (!currentUser) return alert("Войдите!");
        if (isPausedLocal && currentStudyTimestamp) return togglePause();
        await supabase.from('profiles').upsert({ id: currentUser.id, username: currentUser.user_metadata.full_name || currentUser.email.split('@')[0], status: 'Учусь', color: 'var(--color-1)', study_started_at: new Date().toISOString(), is_paused: false, is_online: true }, { onConflict: 'id' });
        checkActiveStudy(); fetchGroup();
    };

    window.togglePause = async () => {
        if (!currentUser || !currentStudyTimestamp) return;
        const name = currentUser.user_metadata.full_name || currentUser.email.split('@')[0];
        if (!isPausedLocal) {
            const total = accumulatedSeconds + Math.floor((new Date() - currentStudyTimestamp) / 1000);
            await supabase.from('profiles').upsert({ id: currentUser.id, username: name, status: 'Кофе (Пауза)', color: 'var(--color-2)', is_paused: true, total_study_time: total, is_online: true }, { onConflict: 'id' });
        } else {
            await supabase.from('profiles').upsert({ id: currentUser.id, username: name, status: 'Учусь', color: 'var(--color-1)', study_started_at: new Date().toISOString(), is_paused: false, is_online: true }, { onConflict: 'id' });
        }
        checkActiveStudy(); fetchGroup();
    };

    window.stopStudy = async () => {
        if (!currentUser) return; clearInterval(localProfileTimer);
        let final = accumulatedSeconds; if (!isPausedLocal && currentStudyTimestamp) final += Math.floor((new Date() - currentStudyTimestamp) / 1000);
        await supabase.from('profiles').upsert({ id: currentUser.id, username: currentUser.user_metadata.full_name || currentUser.email.split('@')[0], status: 'Отдыхает', color: '#eee', study_started_at: null, is_paused: false, total_study_time: final, is_online: true }, { onConflict: 'id' });
        currentStudyTimestamp = null; isPausedLocal = false; accumulatedSeconds = final;
        document.getElementById('timerContainer').style.display = 'none'; checkActiveStudy(); fetchGroup(); updateAchievementsBadge();
    };

    window.changeStatus = async (text, color) => {
        if (!currentUser) return alert("Войдите!");
        let final = accumulatedSeconds; if (currentStudyTimestamp && !isPausedLocal) final += Math.floor((new Date() - currentStudyTimestamp) / 1000);
        await supabase.from('profiles').upsert({ id: currentUser.id, username: currentUser.user_metadata.full_name || currentUser.email.split('@')[0], status: text, color: color, is_online: true, total_study_time: final, study_started_at: null, is_paused: false }, { onConflict: 'id' });
        currentStudyTimestamp = null; isPausedLocal = false; accumulatedSeconds = final;
        checkActiveStudy(); fetchGroup(); updateAchievementsBadge();
    };

    async function fetchGroup() {
        const { data } = await supabase.from('profiles').select('*').order('username', { ascending: true });
        if (!data) return; cachedGroupData = data;
        const list = document.getElementById('groupList'); const now = new Date();
        list.innerHTML = data.map(u => {
            let tHtml = '';
            if (u.study_started_at) {
                if (u.is_paused) tHtml = `<div id="timer-${u.id}" class="group-timer paused">☕ Пауза: ${formatDuration(u.total_study_time)}</div>`;
                else tHtml = `<div id="timer-${u.id}" class="group-timer">⏱️ Учусь: ${formatDuration((u.total_study_time || 0) + Math.floor((now - new Date(u.study_started_at)) / 1000))}</div>`;
            } else if (u.total_study_time > 0) {
                tHtml = `<div class="group-timer paused" style="background:#eee; color:#666; box-shadow:none;">⌛ Всего: ${formatDuration(u.total_study_time)}</div>`;
            }
            return `<div class="user-row"><div class="online-dot ${u.is_online}"></div><div class="user-info"><strong>${escapeHtml(u.username)}</strong><small>Статус: ${escapeHtml(u.status || 'Дома')}</small></div>${tHtml}</div>`;
        }).join('');
    }

    supabase.auth.getSession().then(({ data: { session } }) => { updateUI(session); fetchGroup(); });
    supabase.auth.onAuthStateChange((_e, session) => updateUI(session));
    window.addEventListener('beforeunload', () => setOnlineStatus(false));
    document.getElementById('loginBtn').onclick = () => supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
    document.getElementById('logoutBtn').onclick = async () => { await setOnlineStatus(false); await supabase.auth.signOut(); window.location.reload(); };

    // Чат и Realtime подписки...
    function escapeHtml(t) { return t ? t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
</script>
</body>
</html>
