<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Board / Brutal Auth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap');

        :root {
            --bg: #fff01f;
            --card-bg: #ffffff;
            --border: #000000;
            --shadow: #000000;
            --color-1: #ff90e8;
            --color-2: #23a094;
            --color-3: #91ff71;
            --color-4: #ff6000;
            --online: #00E676;
            --offline: #B0BEC5;
        }

        body {
            font-family: 'Unbounded', sans-serif;
            background-color: var(--bg);
            color: var(--border);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .brutal-card {
            background: var(--card-bg);
            border: 4px solid var(--border);
            box-shadow: 10px 10px 0px var(--shadow);
            padding: 25px;
            position: relative;
            border-radius: 12px;
        }

        h2 {
            margin: 0 0 20px 0;
            text-transform: uppercase;
            font-size: 1.5rem;
            background: var(--bg);
            display: inline-block;
            padding: 5px 10px;
            border: 3px solid var(--border);
            transform: rotate(-2deg);
        }

        #myInfo {
            display: block;
            font-weight: 700;
            margin-bottom: 20px;
            text-decoration: underline;
            word-break: break-all;
            font-size: 0.9rem;
        }

        /* Стильный бруталистичный бейдж для общего времени */
        .total-time-badge {
            font-size: 0.85rem;
            background: var(--color-1);
            color: var(--border);
            border: 3px solid var(--border);
            padding: 8px 14px;
            margin-top: -5px;
            margin-bottom: 20px;
            display: inline-block;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--border);
            transform: rotate(1deg);
        }

        /* Личный таймер в профиле */
        .timer-container {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #fff;
            border: 3px solid var(--border);
            padding: 10px;
            box-shadow: 4px 4px 0px var(--border);
            border-radius: 8px;
        }
        .timer-time {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0055ff;
        }
        .timer-container.paused .timer-time {
            color: var(--color-4);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .brutal-btn {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            border: 3px solid var(--border);
            padding: 15px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border);
            transition: all 0.1s;
            text-transform: uppercase;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        .brutal-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--border);
        }

        .brutal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border);
        }

        .auth-btn {
            grid-column: span 2;
            margin-top: 10px;
        }

        #loginBtn { background: #fff; color: #000; }
        #logoutBtn { background: #000; color: #fff; display: none; }

        /* Монитор группы */
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-row {
            display: flex;
            align-items: center;
            border: 3px solid var(--border);
            padding: 12px;
            background: #fff;
            box-shadow: 4px 4px 0px var(--border);
            border-radius: 8px;
        }

        .online-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--border);
            margin-right: 12px;
            flex-shrink: 0;
        }
        .online-dot.true { background-color: var(--online); }
        .online-dot.false { background-color: var(--offline); }

        .user-info { flex-grow: 1; }
        .user-info strong { display: block; font-size: 1rem; font-weight: 700; }
        .user-info small { font-size: 0.8rem; font-weight: 400; color: #555; }
        
        /* Правая часть: Таймер в списке группы */
        .group-timer {
            margin-left: auto;
            font-size: 0.85rem;
            font-weight: 700;
            color: #0055ff;
            background: #e6f0ff;
            border: 2px solid var(--border);
            padding: 6px 10px;
            box-shadow: 2px 2px 0px var(--border);
            white-space: nowrap;
            border-radius: 6px;
        }
        .group-timer.paused {
            color: #ff6000;
            background: #fff0e6;
        }

        /* Чат */
        .chat-box {
            border: 3px solid var(--border);
            background: #fff;
            height: 220px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .chat-msg {
            font-size: 0.85rem;
            line-height: 1.4;
            word-break: break-all;
        }
        .chat-msg b {
            background: var(--bg);
            padding: 2px 6px;
            border: 2px solid var(--border);
            margin-right: 8px;
            display: inline-block;
            border-radius: 4px;
        }
        .chat-msg b span {
            font-size: 0.65rem;
            font-weight: 400;
            color: #555;
            margin-left: 5px;
        }
        .chat-input-group {
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex-grow: 1;
            font-family: 'Unbounded', sans-serif;
            padding: 12px;
            border: 3px solid var(--border);
            font-size: 0.85rem;
            outline: none;
            box-shadow: 3px 3px 0px var(--border);
            border-radius: 8px;
        }
        .chat-send-btn {
            background: var(--color-3);
            padding: 10px 20px;
            box-shadow: 3px 3px 0px var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brutal-card">
        <h2>Профиль</h2>
        <span id="myInfo">Загрузка...</span>
        <div><div id="myTotalTime" class="total-time-badge" style="display: none;">Накоплено: 0 сек.</div></div>
        
        <div id="timerContainer" class="timer-container">
            <span id="timerLabel">⏱️ Сессия:</span>
            <span id="timerTime" class="timer-time">0 сек.</span>
            
            <button id="pauseBtn" class="brutal-btn" style="padding: 5px 10px; margin-left: auto; background: var(--color-2); font-size: 0.7rem;" onclick="togglePause()">Перерыв</button>
            <button class="brutal-btn" style="padding: 5px 10px; margin-left: 5px; background: var(--color-4); font-size: 0.7rem;" onclick="stopStudy()">Завершить</button>
        </div>

        <div class="status-grid">
            <button class="brutal-btn" style="background: var(--color-1);" onclick="startStudy()">Учусь</button>
            <button class="brutal-btn" style="background: var(--color-2);" onclick="changeStatus('Кофе', 'var(--color-2)')">Кофе</button>
            <button class="brutal-btn" style="background: var(--color-3);" onclick="changeStatus('В игре', 'var(--color-3)')">В игре</button>
            <button class="brutal-btn" style="background: var(--color-4);" onclick="changeStatus('Дома', 'var(--color-4)')">Дома</button>
            
            <button id="loginBtn" class="brutal-btn auth-btn">Войти через Google</button>
            <button id="logoutBtn" class="brutal-btn auth-btn">Выйти из аккаунта</button>
        </div>
    </div>

    <div class="brutal-card">
        <h2>Общий чат</h2>
        <div id="chatBox" class="chat-box"></div>
        <div class="chat-input-group">
            <input type="text" id="chatInput" class="chat-input" placeholder="Сообщение..." maxlength="150">
            <button id="chatSendBtn" class="brutal-btn chat-send-btn">➔</button>
        </div>
    </div>

    <div class="brutal-card">
        <h2>👥 Монитор группы</h2>
        <div id="groupList" class="user-list">
            <p>Синхронизация...</p>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const URL = 'https://uylunguxekgzxprnsgrr.supabase.co';
    const KEY = 'sb_publishable_aLabuAHu5q47IsXEKy8QXw_HTdlY4jt';
    const supabase = createClient(URL, KEY);

    let currentUser = null;
    let localProfileTimer = null;
    let groupTimerInterval = null;
    
    let currentStudyTimestamp = null;
    let accumulatedSeconds = 0;
    let isPausedLocal = false;
    
    let cachedGroupData = [];

    function formatDuration(secondsCount) {
        if (secondsCount < 0 || isNaN(secondsCount)) return '0 сек.';
        if (secondsCount < 60) return `${secondsCount} сек.`;
        const minutes = Math.floor(secondsCount / 60) % 60;
        const hours = Math.floor(secondsCount / 3600);
        
        if (hours > 0) return `${hours}ч ${minutes}м`;
        return `${minutes} мин.`;
    }

    function formatTime(isoString) {
        const d = isoString ? new Date(isoString) : new Date();
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function updateUI(session) {
        currentUser = session?.user || null;
        const info = document.getElementById('myInfo');
        const lBtn = document.getElementById('loginBtn');
        const oBtn = document.getElementById('logoutBtn');
        const totalBadge = document.getElementById('myTotalTime');

        if (currentUser) {
            info.innerText = currentUser.user_metadata.full_name || currentUser.email.split('@')[0];
            lBtn.style.display = 'none';
            oBtn.style.display = 'block';
            totalBadge.style.display = 'inline-block';
            setOnlineStatus(true);
            checkActiveStudy();
        } else {
            info.innerText = "Войдите через Google для смены статуса";
            lBtn.style.display = 'block';
            oBtn.style.display = 'none';
            totalBadge.style.display = 'none';
            document.getElementById('timerContainer').style.display = 'none';
            clearInterval(localProfileTimer);
        }
    }

    async function setOnlineStatus(status) {
        if (!currentUser) return;
        const name = currentUser.user_metadata.full_name || currentUser.email.split('@')[0];
        await supabase.from('profiles').upsert({
            id: currentUser.id,
            username: name,
            is_online: status
        }, { onConflict: 'id' });
    }

    async function checkActiveStudy() {
        if (!currentUser) return;
        const { data } = await supabase.from('profiles').select('study_started_at, total_study_time, is_paused').eq('id', currentUser.id).single();
        
        if (data) {
            accumulatedSeconds = data.total_study_time || 0;
            document.getElementById('myTotalTime').innerText = `Накоплено: ${formatDuration(accumulatedSeconds)}`;
            
            if (data.study_started_at) {
                startLocalTimer(data.study_started_at, accumulatedSeconds, data.is_paused);
            } else {
                document.getElementById('timerContainer').style.display = 'none';
                clearInterval(localProfileTimer);
            }
        }
    }

    function startLocalTimer(timestamp, storedTotalSeconds, isPausedDB) {
        currentStudyTimestamp = new Date(timestamp);
        accumulatedSeconds = storedTotalSeconds;
        isPausedLocal = isPausedDB;

        const container = document.getElementById('timerContainer');
        const label = document.getElementById('timerLabel');
        const pBtn = document.getElementById('pauseBtn');
        
        container.style.display = 'flex';
        clearInterval(localProfileTimer);

        if (isPausedLocal) {
            container.classList.add('paused');
            label.innerText = '☕ Пауза:';
            pBtn.innerText = 'Продолжить';
            pBtn.style.background = 'var(--color-3)';
            document.getElementById('timerTime').innerText = formatDuration(accumulatedSeconds);
        } else {
            container.classList.remove('paused');
            label.innerText = '⏱️ Сессия:';
            pBtn.innerText = 'Перерыв';
            pBtn.style.background = 'var(--color-2)';

            localProfileTimer = setInterval(() => {
                const liveSessionSeconds = Math.floor((new Date() - currentStudyTimestamp) / 1000);
                document.getElementById('timerTime').innerText = formatDuration(accumulatedSeconds + liveSessionSeconds);
            }, 1000);
        }
    }

    function startGroupLiveTimers() {
        clearInterval(groupTimerInterval);
        groupTimerInterval = setInterval(() => {
            const now = new Date();
            cachedGroupData.forEach(user => {
                if (user.study_started_at) {
                    const timerElement = document.getElementById(`timer-${user.id}`);
                    if (timerElement) {
                        const baseSec = user.total_study_time || 0;
                        if (user.is_paused) {
                            timerElement.innerText = `☕ Пауза: ${formatDuration(baseSec)}`;
                        } else {
                            const liveSec = Math.floor((now - new Date(user.study_started_at)) / 1000);
                            timerElement.innerText = `⏱️ Учусь: ${formatDuration(baseSec + liveSec)}`;
                        }
                    }
                }
            });
        }, 1000);
    }

    window.startStudy = async () => {
        if (!currentUser) return alert("Нужно войти через Google!");
        
        if (isPausedLocal && currentStudyTimestamp) {
            return togglePause();
        }

        const name = currentUser.user_metadata.full_name || currentUser.email.split('@')[0];
        const startTime = new Date().toISOString();

        await supabase.from('profiles').upsert({
            id: currentUser.id,
            username: name,
            status: 'Учусь',
            color: 'var(--color-1)',
            study_started_at: startTime,
            is_paused: false,
            is_online: true
        }, { onConflict: 'id' });

        checkActiveStudy();
        fetchGroup();
    };

    window.togglePause = async () => {
        if (!currentUser || !currentStudyTimestamp) return;
        const name = currentUser.user_metadata.full_name || currentUser.email.split('@')[0];

        if (!isPausedLocal) {
            const sessionSeconds = Math.floor((new Date() - currentStudyTimestamp) / 1000);
            const newTotal = accumulatedSeconds + sessionSeconds;

            await supabase.from('profiles').upsert({
                id: currentUser.id,
                username: name,
                status: 'Кофе (Пауза)',
                color: 'var(--color-2)',
                is_paused: true,
                total_study_time: newTotal,
                is_online: true
            }, { onConflict: 'id' });
        } else {
            const startTime = new Date().toISOString();
            await supabase.from('profiles').upsert({
                id: currentUser.id,
                username: name,
                status: 'Учусь',
                color: 'var(--color-1)',
                study_started_at: startTime,
                is_paused: false,
                is_online: true
            }, { onConflict: 'id' });
        }
        checkActiveStudy();
        fetchGroup();
    };

    window.stopStudy = async () => {
        if (!currentUser) return;
        clearInterval(localProfileTimer);

        let finalTotal = accumulatedSeconds;
        if (!isPausedLocal && currentStudyTimestamp) {
            const sessionSeconds = Math.floor((new Date() - currentStudyTimestamp) / 1000);
            finalTotal += sessionSeconds;
        }

        const name = currentUser.user_metadata.full_name || currentUser.email.split('@')[0];
        await supabase.from('profiles').upsert({
            id: currentUser.id,
            username: name,
            status: 'Отдыхает',
            color: '#eee',
            study_started_at: null,
            is_paused: false,
            total_study_time: finalTotal,
            is_online: true
        }, { onConflict: 'id' });

        currentStudyTimestamp = null;
        document.getElementById('timerContainer').style.display = 'none';
        checkActiveStudy();
        fetchGroup();
    };

    window.changeStatus = async (text, color) => {
        if (!currentUser) return alert("Нужно войти через Google!");
        const name = currentUser.user_metadata.full_name || currentUser.email.split('@')[0];

        // Чтобы обычный статус не затирал таймер, передаем текущие параметры времени
        const updateData = {
            id: currentUser.id,
            username: name,
            status: text,
            color: color,
            is_online: true,
            total_study_time: accumulatedSeconds,
            is_paused: isPausedLocal
        };

        if (currentStudyTimestamp) {
            updateData.study_started_at = currentStudyTimestamp.toISOString();
        }

        await supabase.from('profiles').upsert(updateData, { onConflict: 'id' });
        fetchGroup();
    };

    // --- Логика чата и синхронизации ---

    supabase.auth.getSession().then(({ data: { session } }) => {
        updateUI(session);
        fetchGroup();
        fetchChat();
    });

    supabase.auth.onAuthStateChange((_event, session) => {
        updateUI(session);
        fetchGroup();
    });

    window.addEventListener('beforeunload', () => {
        setOnlineStatus(false);
    });

    document.getElementById('loginBtn').onclick = async () => {
        await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.href }
        });
    };

    document.getElementById('logoutBtn').onclick = async () => {
        await setOnlineStatus(false);
        await supabase.auth.signOut();
        window.location.reload();
    };

    async function fetchGroup() {
        const { data, error } = await supabase
            .from('profiles')
            .select('*')
            .order('username', { ascending: true });

        if (error) return console.error(error);

        cachedGroupData = data;
        const list = document.getElementById('groupList');
        const now = new Date();

        list.innerHTML = data.map(user => {
            let timerHtml = '';
            
            if (user.study_started_at) {
                const baseSec = user.total_study_time || 0;
                if (user.is_paused) {
                    timerHtml = `<div id="timer-${user.id}" class="group-timer paused">☕ Пауза: ${formatDuration(baseSec)}</div>`;
                } else {
                    const liveSec = Math.floor((now - new Date(user.study_started_at)) / 1000);
                    timerHtml = `<div id="timer-${user.id}" class="group-timer">⏱️ Учусь: ${formatDuration(baseSec + liveSec)}</div>`;
                }
            } else if (user.total_study_time > 0) {
                timerHtml = `<div class="group-timer paused" style="background:#eee; color:#666;">⌛ Всего: ${formatDuration(user.total_study_time)}</div>`;
            }

            return `
                <div class="user-row">
                    <div class="online-dot ${user.is_online ? 'true' : 'false'}"></div>
                    <div class="user-info">
                        <strong>${user.username}</strong>
                        <small>Статус: ${user.status || 'Дома'}</small>
                    </div>
                    ${timerHtml}
                </div>
            `;
        }).join('');

        startGroupLiveTimers();
    }

    async function fetchChat() {
        const { data, error } = await supabase
            .from('messages')
            .select('*')
            .order('id', { ascending: false })
            .limit(40);

        if (error) return console.error(error);
        
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = data.reverse().map(msg => `
            <div class="chat-msg"><b>${msg.username}<span>${formatTime(msg.created_at)}</span>:</b><span>${escapeHtml(msg.text)}</span></div>
        `).join('');
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        if (!currentUser) return alert("Войдите, чтобы писать в чат!");
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        await supabase.from('messages').insert({
            username: currentUser.user_metadata.full_name || currentUser.email.split('@')[0],
            text: text
        });
    }

    document.getElementById('chatSendBtn').onclick = sendMessage;
    document.getElementById('chatInput').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

    supabase
        .channel('public_changes')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
            const chatBox = document.getElementById('chatBox');
            const msgEl = document.createElement('div');
            msgEl.className = 'chat-msg';
            msgEl.innerHTML = `<b>${payload.new.username}<span>${formatTime(payload.new.created_at)}</span>:</b><span>${escapeHtml(payload.new.text)}</span>`;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
            fetchGroup();
        })
        .subscribe();

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    setInterval(fetchGroup, 10000);
</script>

</body>
</html>
