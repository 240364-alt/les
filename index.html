<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Board / Brutal Auth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap');

        :root {
            --bg: #fff01f;
            --card-bg: #ffffff;
            --border: #000000;
            --shadow: #000000;
            --color-1: #ff90e8;
            --color-2: #23a094;
            --color-3: #91ff71;
            --color-4: #ff6000;
            --online: #00E676;
            --offline: #B0BEC5;
        }

        body {
            font-family: 'Unbounded', sans-serif;
            background-color: var(--bg);
            color: var(--border);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .brutal-card {
            background: var(--card-bg);
            border: 4px solid var(--border);
            box-shadow: 10px 10px 0px var(--shadow);
            padding: 25px;
            position: relative;
            border-radius: 12px;
        }

        h2 {
            margin: 0 0 20px 0;
            text-transform: uppercase;
            font-size: 1.5rem;
            background: var(--bg);
            display: inline-block;
            padding: 5px 10px;
            border: 3px solid var(--border);
            transform: rotate(-2deg);
        }

        #myInfo {
            display: block;
            font-weight: 700;
            margin-bottom: 20px;
            text-decoration: underline;
            word-break: break-all;
            font-size: 0.9rem;
        }

        /* Стильный бруталистичный бейдж для общего времени */
        .total-time-badge {
            font-size: 0.85rem;
            background: var(--color-1);
            color: var(--border);
            border: 3px solid var(--border);
            padding: 8px 14px;
            margin-top: -5px;
            margin-bottom: 20px;
            display: inline-block;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--border);
            transform: rotate(1deg);
        }

        /* Личный таймер в профиле */
        .timer-container {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #fff;
            border: 3px solid var(--border);
            padding: 10px;
            box-shadow: 4px 4px 0px var(--border);
            border-radius: 8px;
        }
        .timer-time {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0055ff;
        }
        .timer-container.paused .timer-time {
            color: var(--color-4);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .brutal-btn {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            border: 3px solid var(--border);
            padding: 15px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border);
            transition: all 0.1s;
            text-transform: uppercase;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        .brutal-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--border);
        }

        .brutal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border);
        }

        .auth-btn {
            grid-column: span 2;
            margin-top: 10px;
        }

        #loginBtn { background: #fff; color: #000; }
        #logoutBtn { background: #000; color: #fff; display: none; }

        /* Монитор группы */
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-row {
            display: flex;
            align-items: center;
            border: 3px solid var(--border);
            padding: 12px;
            background: #fff;
            box-shadow: 4px 4px 0px var(--border);
            border-radius: 8px;
        }

        .online-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--border);
            margin-right: 12px;
            flex-shrink: 0;
        }
        .online-dot.true { background-color: var(--online); }
        .online-dot.false { background-color: var(--offline); }

        .user-info { flex-grow: 1; }
        .user-info strong { display: block; font-size: 1rem; font-weight: 700; }
        .user-info small { font-size: 0.8rem; font-weight: 400; color: #555; }
        
        /* Правая часть: Таймер в списке группы */
        .group-timer {
            margin-left: auto;
            font-size: 0.85rem;
            font-weight: 700;
            color: #0055ff;
            background: #e6f0ff;
            border: 2px solid var(--border);
            padding: 6px 10px;
            box-shadow: 2px 2px 0px var(--border);
            white-space: nowrap;
            border-radius: 6px;
        }
        .group-timer.paused {
            color: #ff6000;
            background: #fff0e6;
        }

        /* Чат */
        .chat-box {
            border: 3px solid var(--border);
            background: #fff;
            height: 220px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .chat-msg {
            font-size: 0.85rem;
            line-height: 1.4;
            word-break: break-all;
        }
        .chat-msg b {
            background: var(--bg);
            padding: 2px 6px;
            border: 2px solid var(--border);
            margin-right: 8px;
            display: inline-block;
            border-radius: 4px;
        }
        .chat-msg b span {
            font-size: 0.65rem;
            font-weight: 400;
            color: #555;
            margin-left: 5px;
        }
        .chat-input-group {
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex-grow: 1;
            font-family: 'Unbounded', sans-serif;
            padding: 12px;
            border: 3px solid var(--border);
            font-size: 0.85rem;
            outline: none;
            box-shadow: 3px 3px 0px var(--border);
            border-radius: 8px;
        }
        .chat-send-btn {
            background: var(--color-3);
            padding: 10px 20px;
            box-shadow: 3px 3px 0px var(--border);
        }
    </style>
</head>
<body>
