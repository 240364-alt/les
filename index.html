<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Board / Brutal Auth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap');

        :root {
            --bg: #fff01f;
            --card-bg: #ffffff;
            --border: #000000;
            --shadow: #000000;
            --color-1: #ff90e8;
            --color-2: #23a094;
            --color-3: #91ff71;
            --color-4: #ff6000;
            --online: #00E676;
            --offline: #B0BEC5;
        }

        body {
            font-family: 'Unbounded', sans-serif;
            background-color: var(--bg);
            color: var(--border);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .brutal-card {
            background: var(--card-bg);
            border: 4px solid var(--border);
            box-shadow: 10px 10px 0px var(--shadow);
            padding: 25px;
            position: relative;
        }

        h2 {
            margin: 0 0 20px 0;
            text-transform: uppercase;
            font-size: 1.5rem;
            background: var(--bg);
            display: inline-block;
            padding: 5px 10px;
            border: 3px solid var(--border);
            transform: rotate(-2deg);
        }

        #myInfo {
            display: block;
            font-weight: 700;
            margin-bottom: 20px;
            text-decoration: underline;
            word-break: break-all;
            font-size: 0.9rem;
        }

        /* Таймер учебы */
        .timer-container {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #fff;
            border: 3px solid var(--border);
            padding: 10px;
            box-shadow: 4px 4px 0px var(--border);
        }
        .timer-time {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0055ff;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .brutal-btn {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            border: 3px solid var(--border);
            padding: 15px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border);
            transition: all 0.1s;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .brutal-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--border);
        }

        .brutal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border);
        }

        .auth-btn {
            grid-column: span 2;
            margin-top: 10px;
        }

        #loginBtn { background: #fff; color: #000; }
        #logoutBtn { background: #000; color: #fff; display: none; }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-row {
            display: flex;
            align-items: center;
            border: 3px solid var(--border);
            padding: 10px;
            background: #fff;
            position: relative;
        }

        /* Индикатор онлайна */
        .online-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--border);
            margin-right: 10px;
            flex-shrink: 0;
        }
        .online-dot.true { background-color: var(--online); }
        .online-dot.false { background-color: var(--offline); }

        .status-box {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-info { flex-grow: 1; }
        .user-info strong { display: block; font-size: 1rem; }
        .user-info small { font-size: 0.75rem; font-weight: 400; display: block; }
        .user-info .study-time { font-size: 0.7rem; color: #555; margin-top: 2px; }

        /* Стили Брутального Чата */
        .chat-box {
            border: 3px solid var(--border);
            background: #fff;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .chat-msg {
            font-size: 0.8rem;
            line-height: 1.3;
            word-break: break-all;
        }
        .chat-msg b {
            background: var(--bg);
            padding: 1px 4px;
            border: 1px solid var(--border);
            margin-right: 5px;
        }
        .chat-input-group {
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex-grow: 1;
            font-family: 'Unbounded', sans-serif;
            padding: 10px;
            border: 3px solid var(--border);
            font-size: 0.8rem;
            outline: none;
        }
        .chat-send-btn {
            background: var(--color-3);
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brutal-card">
        <h2>Профиль</h2>
        <span id="myInfo">Загрузка...</span>
        
        <div id="timerContainer" class="timer-container">
            <span>⏱️ В учебе:</span>
            <span id="timerTime" class="timer-time">0ч 0м 0с</span>
            <button class="brutal-btn" style="padding: 5px 10px; margin-left: auto; background: var(--color-4); font-size: 0.7rem;" onclick="stopStudy()">Завершить</button>
        </div>

        <div class="status-grid">
            <button class="brutal-btn" style="background: var(--color-1);" onclick="changeStatus('Учусь', 'var(--color-1)', true)">Учусь</button>
            <button class="brutal-btn" style="background: var(--color-2);" onclick="changeStatus('Кофе', 'var(--color-2)')">Кофе</button>
            <button class="brutal-btn" style="background: var(--color-3);" onclick="changeStatus('В игре', 'var(--color-3)')">В игре</button>
            <button class="brutal-btn" style="background: var(--color-4);" onclick="changeStatus('Дома', 'var(--color-4)')">Дома</button>
            
            <button id="loginBtn" class="brutal-btn auth-btn">Войти через Google</button>
            <button id="logoutBtn" class="brutal-btn auth-btn">Выйти из аккаунта</button>
        </div>
    </div>

    <div class="brutal-card">
        <h2>Общий чат</h2>
        <div id="chatBox" class="chat-box"></div>
        <div class="chat-input-group">
            <input type="text" id="chatInput" class="chat-input" placeholder="Сообщение..." maxlength="150">
            <button id="chatSendBtn" class="brutal-btn chat-send-btn">➔</button>
        </div>
    </div>

    <div class="brutal-card">
        <h2>Монитор группы</h2>
        <div id="groupList" class="user-list">
            <p>Синхронизация...</p>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const URL = 'https://uylunguxekgzxprnsgrr.supabase.co';
    const KEY = 'sb_publishable_aLabuAHu5q47IsXEKy8QXw_HTdlY4jt';
    const supabase = createClient(URL, KEY);

    let currentUser = null;
    let studyInterval = null;
    let currentStudyTimestamp = null;

    // Форматирование времени в текст (0ч 0м 0с)
    function formatDuration(ms) {
        if (ms < 0 || isNaN(ms)) return '0ч 0м 0с';
        const seconds = Math.floor((ms / 1000) % 60);
        const minutes = Math.floor((ms / (1000 * 60)) % 60);
        const hours = Math.floor(ms / (1000 * 60 * 60));
        return `${hours}ч ${minutes}м ${seconds}с`;
    }

    // Обновление интерфейса авторизации
    function updateUI(session) {
        currentUser = session?.user || null;
        const info = document.getElementById('myInfo');
        const lBtn = document.getElementById('loginBtn');
        const oBtn = document.getElementById('logoutBtn');

        if (currentUser) {
            info.innerText = `Вы: ${currentUser.email}`;
            lBtn.style.display = 'none';
            oBtn.style.display = 'block';
            setOnlineStatus(true);
            checkActiveStudy();
        } else {
            info.innerText = "Войдите через Google для смены статуса";
            lBtn.style.display = 'block';
            oBtn.style.display = 'none';
            document.getElementById('timerContainer').style.display = 'none';
            clearInterval(studyInterval);
        }
    }

    // Установка статуса сети в БД
    async function setOnlineStatus(status) {
        if (!currentUser) return;
        await supabase.from('profiles').from('profiles').upsert({
            id: currentUser.id,
            username: currentUser.email.split('@')[0],
            is_online: status
        });
    }

    // Проверка текущей активной учебы
    async function checkActiveStudy() {
        const { data, error } = await supabase.from('profiles').select('study_started_at').eq('id', currentUser.id).single();
        if (data && data.study_started_at) {
            startLocalTimer(data.study_started_at);
        } else {
            document.getElementById('timerContainer').style.display = 'none';
            clearInterval(studyInterval);
        }
    }

    function startLocalTimer(timestamp) {
        currentStudyTimestamp = new Date(timestamp);
        document.getElementById('timerContainer').style.display = 'flex';
        clearInterval(studyInterval);
        
        studyInterval = setInterval(() => {
            const now = new Date();
            const diff = now - currentStudyTimestamp;
            document.getElementById('timerTime').innerText = formatDuration(diff);
        }, 1000);
    }

    // Инициализация при загрузке
    supabase.auth.getSession().then(({ data: { session } }) => {
        updateUI(session);
        fetchGroup();
        fetchChat();
    });

    // Слушатель входа/выхода
    supabase.auth.onAuthStateChange((_event, session) => {
        updateUI(session);
        fetchGroup();
    });

    // Действие при закрытии вкладки — перевод в оффлайн
    window.addEventListener('beforeunload', () => {
        setOnlineStatus(false);
    });

    // Кнопка входа
    document.getElementById('loginBtn').onclick = async () => {
        await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: 'https://240364-alt.github.io/les/' }
        });
    };

    // Кнопка выхода
    document.getElementById('logoutBtn').onclick = async () => {
        await setOnlineStatus(false);
        await supabase.auth.signOut();
        window.location.reload();
    };

    // Смена статуса пользователя
    window.changeStatus = async (text, color, startStudy = false) => {
        if (!currentUser) return alert("Нужно войти через Google!");

        const updateData = {
            id: currentUser.id,
            username: currentUser.email.split('@')[0],
            status: text,
            color: color,
            is_online: true
        };

        if (startStudy) {
            const startTime = new Date().toISOString();
            updateData.study_started_at = startTime;
            startLocalTimer(startTime);
        }

        const { error } = await supabase.from('profiles').upsert(updateData);

        if (error) console.error('Ошибка базы:', error);
        else fetchGroup();
    };

    // Остановка таймера учебы
    window.stopStudy = async () => {
        if (!currentUser) return;
        clearInterval(studyInterval);
        document.getElementById('timerContainer').style.display = 'none';

        await supabase.from('profiles').upsert({
            id: currentUser.id,
            username: currentUser.email.split('@')[0],
            status: 'Отдыхает',
            color: '#eee',
            study_started_at: null
        });
        fetchGroup();
    };

    // Получение списка группы
    async function fetchGroup() {
        const { data, error } = await supabase
            .from('profiles')
            .select('*')
            .order('username', { ascending: true });

        if (error) return console.error(error);

        const list = document.getElementById('groupList');
        const now = new Date();

        list.innerHTML = data.map(user => {
            let studyTimeText = '';
            if (user.status === 'Учусь' && user.study_started_at) {
                const diff = now - new Date(user.study_started_at);
                studyTimeText = `<div class="study-time">⏱️ ${formatDuration(diff)}</div>`;
            }

            return `
                <div class="user-row">
                    <div class="online-dot ${user.is_online ? 'true' : 'false'}"></div>
                    <div class="status-box" style="background: ${user.color || '#eee'}">⚡</div>
                    <div class="user-info">
                        <strong>${user.username}</strong>
                        <small>${user.status || 'OFFLINE'}</small>
                        ${studyTimeText}
                    </div>
                </div>
            `;
        }).join('');
    }

    // --- ЛОГИКА СЕКЦИИ ЧАТА ---
    async function fetchChat() {
        const { data, error } = await supabase
            .from('messages')
            .select('*')
            .order('id', { ascending: false })
            .limit(30);

        if (error) return console.error(error);
        
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = data.reverse().map(msg => `
            <div class="chat-msg"><b>${msg.username}:</b><span>${escapeHtml(msg.text)}</span></div>
        `).join('');
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        if (!currentUser) return alert("Войдите, чтобы писать в чат!");
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        const { error } = await supabase.from('messages').insert({
            username: currentUser.email.split('@')[0],
            text: text
        });
        if (error) console.error(error);
    }

    document.getElementById('chatSendBtn').onclick = sendMessage;
    document.getElementById('chatInput').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

    // Подписка на чат в реальном времени (Realtime)
    supabase
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', pattern: 'public', table: 'messages' }, payload => {
            const chatBox = document.getElementById('chatBox');
            const msgEl = document.createElement('div');
            msgEl.className = 'chat-msg';
            msgEl.innerHTML = `<b>${payload.new.username}:</b><span>${escapeHtml(payload.new.text)}</span>`;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        })
        .subscribe();

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Регулярное обновление монитора (каждые 5 секунд)
    setInterval(fetchGroup, 5000);
</script>

</body>
</html>
